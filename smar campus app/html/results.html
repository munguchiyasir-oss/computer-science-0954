<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Results</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body><div class="container py-4">
<a href="/">← Dashboard</a><h2 class="mt-3">Examination Results</h2>
<form action="/results/save" method="post" class="row g-2 mb-4">
<input class="form-control" name="registrationNumber" placeholder="Student Registration Number" required>
<input class="form-control" name="courseCode" placeholder="Course Code" required>
<input class="form-control" type="number" step="0.01" name="coursework" placeholder="Coursework / 30" required>
<input class="form-control" type="number" step="0.01" name="examination" placeholder="Examination / 70" required>
<button class="btn btn-primary">Save Result & Calculate Grade</button>
</form>
<table class="table table-bordered"><tr><th>Student</th><th>Course</th><th>Coursework</th><th>Exam</th><th>Total</th><th>Grade</th><th>GP</th></tr>
<tr th:each="r : ${results}">
<td th:text="${r.registrationNumber}"></td><td th:text="${r.courseCode}"></td><td th:text="${r.coursework}"></td>
<td th:text="${r.examination}"></td><td th:text="${r.total}"></td><td th:text="${r.grade}"></td><td th:text="${r.gradePoint}"></td></tr></table>
</div></body></html>
