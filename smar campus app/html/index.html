<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Smart Campus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="navbar navbar-dark bg-primary">
    <div class="container"><a class="navbar-brand" href="/">Smart Campus</a></div>
</nav>
<div class="container py-4">
    <h1>Smart Campus Student Management System</h1>
    <p class="text-muted">Java Spring Boot Academic Information System</p>
    <div class="row g-3">
        <div class="col-md-3"><div class="card p-3"><h5>Students</h5><h2 th:text="${studentCount}">0</h2><a href="/students">Manage</a></div></div>
        <div class="col-md-3"><div class="card p-3"><h5>Courses</h5><h2 th:text="${courseCount}">0</h2><a href="/courses">Manage</a></div></div>
        <div class="col-md-3"><div class="card p-3"><h5>Results</h5><h2 th:text="${resultCount}">0</h2><a href="/results">Manage</a></div></div>
        <div class="col-md-3"><div class="card p-3"><h5>Attendance</h5><h2 th:text="${attendanceCount}">0</h2><a href="/attendance">Manage</a></div></div>
    </div>
    <hr>
    <p><b>Project users:</b> Administrator, Lecturer and Student.</p>
</div>
</body>
</html>
