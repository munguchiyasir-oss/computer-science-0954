<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Students</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body><div class="container py-4">
<a href="/">← Dashboard</a><h2 class="mt-3">Student Registration</h2>
<form action="/students/save" method="post" class="row g-2 mb-4">
<input class="form-control col" name="registrationNumber" placeholder="Registration Number" required>
<input class="form-control col" name="fullName" placeholder="Full Name" required>
<input class="form-control col" name="email" placeholder="Email">
<input class="form-control col" name="phone" placeholder="Phone">
<input class="form-control col" name="program" placeholder="Program">
<input class="form-control col" name="department" placeholder="Department">
<button class="btn btn-primary">Save Student</button>
</form>
<table class="table table-bordered"><tr><th>Reg No</th><th>Name</th><th>Email</th><th>Program</th><th>Department</th><th>Action</th></tr>
<tr th:each="s : ${students}">
<td th:text="${s.registrationNumber}"></td><td th:text="${s.fullName}"></td><td th:text="${s.email}"></td>
<td th:text="${s.program}"></td><td th:text="${s.department}"></td>
<td><a class="btn btn-sm btn-danger" th:href="@{'/students/delete/' + ${s.id}}">Delete</a></td></tr></table>
</div></body></html>
