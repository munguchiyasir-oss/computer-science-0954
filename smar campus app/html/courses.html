<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Courses</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body><div class="container py-4">
<a href="/">← Dashboard</a><h2 class="mt-3">Course Management</h2>
<form action="/courses/save" method="post" class="row g-2 mb-4">
<input class="form-control" name="code" placeholder="Course Code" required>
<input class="form-control" name="name" placeholder="Course Name" required>
<input class="form-control" type="number" name="creditUnits" placeholder="Credit Units" required>
<input class="form-control" name="lecturer" placeholder="Lecturer">
<button class="btn btn-primary">Save Course</button>
</form>
<table class="table table-bordered"><tr><th>Code</th><th>Name</th><th>Credits</th><th>Lecturer</th><th>Action</th></tr>
<tr th:each="c : ${courses}">
<td th:text="${c.code}"></td><td th:text="${c.name}"></td><td th:text="${c.creditUnits}"></td><td th:text="${c.lecturer}"></td>
<td><a class="btn btn-sm btn-danger" th:href="@{'/courses/delete/' + ${c.id}}">Delete</a></td></tr></table>
</div></body></html>
