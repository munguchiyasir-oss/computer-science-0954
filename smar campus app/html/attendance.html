<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Attendance</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body><div class="container py-4">
<a href="/">← Dashboard</a><h2 class="mt-3">Attendance Management</h2>
<form action="/attendance/save" method="post" class="row g-2 mb-4">
<input class="form-control" name="registrationNumber" placeholder="Student Registration Number" required>
<input class="form-control" name="courseCode" placeholder="Course Code" required>
<input class="form-control" type="date" name="date" required>
<select class="form-control" name="present"><option value="true">Present</option><option value="false">Absent</option></select>
<button class="btn btn-primary">Save Attendance</button>
</form>
<table class="table table-bordered"><tr><th>Student</th><th>Course</th><th>Date</th><th>Status</th></tr>
<tr th:each="a : ${attendanceList}">
<td th:text="${a.registrationNumber}"></td><td th:text="${a.courseCode}"></td><td th:text="${a.date}"></td>
<td th:text="${a.present ? 'Present' : 'Absent'}"></td></tr></table>
</div></body></html>
